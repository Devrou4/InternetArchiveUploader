name: Build Linux artifact

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglvnd0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 libfreetype6 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Source smoke test
        run: xvfb-run -a python scripts/smoke_gui.py

      - name: Build bundle
        run: python -m PyInstaller packaging/linux.spec --noconfirm

      - name: Check bundle contents
        run: python -m uploader.packaging_contract dist/InternetArchiveUploader

      - name: Packaged smoke test
        run: xvfb-run -a python scripts/smoke_dist.py dist/InternetArchiveUploader

      - name: Compress
        run: |
          VERSION="${GITHUB_REF_NAME:-0.0.0}"
          NAME="InternetArchiveUploader-${VERSION}-linux-x86_64"
          tar -C dist -czf "${NAME}.tar.gz" InternetArchiveUploader
          sha256sum "${NAME}.tar.gz" > SHA256SUMS
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.os }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            SHA256SUMS
          if-no-files-found: error

  package-smoke:
    name: Verify downloaded artifact (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ matrix.os }}"
          merge-multiple: true

      - name: Install runtime libraries (no Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglvnd0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 libfreetype6 xvfb

      - name: Verify checksum and launch
        run: |
          sha256sum -c SHA256SUMS
          tar -xzf ./*.tar.gz
          xvfb-run -a ./InternetArchiveUploader/InternetArchiveUploader --smoke-test

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true

      - name: Show collected files
        run: ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            SHA256SUMS
          fail_on_unmatched_files: true