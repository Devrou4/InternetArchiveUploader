name: Build desktop artifacts

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-linux:
    name: Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglvnd0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 libfreetype6 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Source smoke test
        run: xvfb-run -a python scripts/smoke_gui.py

      - name: Build bundle
        run: python -m PyInstaller packaging/linux.spec --noconfirm

      - name: Check bundle contents
        run: python -m uploader.packaging_contract dist/InternetArchiveUploader

      - name: Packaged smoke test
        run: xvfb-run -a python scripts/smoke_dist.py dist/InternetArchiveUploader

      - name: Compress
        run: |
          VERSION="${GITHUB_REF_NAME:-0.0.0}"
          NAME="InternetArchiveUploader-${VERSION}-linux-x86_64"
          tar -C dist -czf "${NAME}.tar.gz" InternetArchiveUploader
          sha256sum "${NAME}.tar.gz" > "SHA256SUMS-linux-${{ matrix.os }}"
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.os }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            SHA256SUMS-linux-${{ matrix.os }}
          if-no-files-found: error

  build-windows:
    name: Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
        shell: pwsh

      - name: Run tests
        run: python -m pytest -q
        shell: pwsh

      - name: Source smoke test
        run: python scripts/smoke_gui.py
        shell: pwsh

      - name: Build bundle
        run: python -m PyInstaller packaging/windows.spec --noconfirm
        shell: pwsh

      - name: Check bundle contents
        run: python -m uploader.packaging_contract dist/InternetArchiveUploader
        shell: pwsh

      - name: Packaged smoke test
        run: python scripts/smoke_dist.py dist/InternetArchiveUploader
        shell: pwsh

      - name: Compress
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "0.0.0" }
          $name = "InternetArchiveUploader-$version-windows-x86_64"
          Compress-Archive -Path "dist/InternetArchiveUploader" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "SHA256SUMS-windows-${{ matrix.os }}"
          "ARTIFACT_NAME=$name" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "ZIP_NAME=$name.zip" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.os }}
          path: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS-windows-${{ matrix.os }}
          if-no-files-found: error

  verify-linux:
    name: Verify downloaded Linux artifact (${{ matrix.os }})
    needs: build-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-linux-*-${{ matrix.os }}"
          merge-multiple: true

      - name: Install runtime libraries (no Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglvnd0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 libfreetype6 xvfb

      - name: Verify checksum and launch
        run: |
          sha256sum -c SHA256SUMS-linux-${{ matrix.os }}
          tar -xzf ./*.tar.gz
          xvfb-run -a ./InternetArchiveUploader/InternetArchiveUploader --smoke-test

  verify-windows:
    name: Verify downloaded Windows artifact (${{ matrix.os }})
    needs: build-windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-windows-*-${{ matrix.os }}"
          merge-multiple: true

      - name: Verify checksum and launch (no Python on PATH)
        run: |
          $expected = (Get-Content "SHA256SUMS-windows-${{ matrix.os }}").Split(" ")[0]
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          $actual = (Get-FileHash $zip.Name -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum mismatch" }
          Expand-Archive -Path $zip.Name -DestinationPath .
          & ".\InternetArchiveUploader\InternetArchiveUploader.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed with $LASTEXITCODE" }
        shell: pwsh

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, verify-linux, verify-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true

      - name: Show collected files
        run: ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            SHA256SUMS-*
          fail_on_unmatched_files: true
